# Daily incremental ELT: load new/changed files into RAW, then incremental dbt transform + tests.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SNOWFLAKE_ACCOUNT      e.g. <locator>.<region>.<cloud>
#   SNOWFLAKE_USER         the user's LOGIN_NAME (DESC USER)
#   SNOWFLAKE_PRIVATE_KEY  full contents of rsa_key.p8 (including BEGIN/END lines)
name: elt-daily

on:
  schedule:
    - cron: "30 5 * * *"     # 05:30 UTC, 30 min after Snowflake task LOAD_RAW_TASK (05:00 UTC)
  workflow_dispatch: {}       # "Run workflow" button for manual runs

concurrency:
  group: elt-daily
  cancel-in-progress: false

jobs:
  elt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: navoti_dbt
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/.ci_profiles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-core>=1.10,<2.0" "dbt-snowflake>=1.10,<2.0"

      - name: Write dbt profile (credentials come from secrets, never from the repo)
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          navoti_sales:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
                role: ACCOUNTADMIN
                warehouse: LAB_WH
                database: NAVOTI_DB
                schema: DBT
                threads: 4
          EOF

      - name: Check connection
        run: dbt debug

      # 1) Incremental LOAD: COPY INTO skips files already loaded, so this is safe to repeat
      #    even when the Snowflake task already ran.
      - name: Load new / changed files into RAW
        run: dbt run-operation load_raw

      - name: Source freshness
        run: dbt source freshness
        continue-on-error: true

      # 2) Incremental TRANSFORM: MERGE only new/changed rows, then run all tests.
      #    A failing test fails the job, so bad data is flagged before anyone refreshes the report.
      - name: dbt build
        run: dbt build

      - name: Keep run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            navoti_dbt/target/run_results.json
            navoti_dbt/target/manifest.json
            navoti_dbt/logs/
          if-no-files-found: ignore
