name: navoti_sales
version: "1.0.0"
config-version: 2
profile: navoti_sales

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  navoti_sales:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      # Every dimension and fact is incremental and uses MERGE (no full reloads).
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
      # Keep the original insert timestamp when a row is updated by the MERGE.
      +merge_exclude_columns: ["dw_inserted_at"]
