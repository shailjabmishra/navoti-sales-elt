navoti_sales:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: <account_locator>.<region>.<cloud>
      user: "{{ env_var('SNOWFLAKE_USER') }}"

      private_key_path: "C:/Users/<you>/.dbt/rsa_key.p8"

      # password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"

      # authenticator: externalbrowser

      role: ACCOUNTADMIN
      warehouse: LAB_WH
      database: NAVOTI_DB
      schema: DBT
      threads: 4
